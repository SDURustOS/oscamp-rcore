name: rCore Chapter 1 Autograding

on:
  push:
    branches:
      - ch1
    paths-ignore:
      - README.md
      - "**/*.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Chapter 1
    runs-on: ubuntu-latest

    container:
      image: alicesama/rcore-ci:2024a

    steps:
      - name: Checkout submission
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        shell: bash
        run: |
          git config --global --add safe.directory \
            "/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}"

      - name: Show environment information
        shell: bash
        run: |
          rustc --version
          cargo --version
          qemu-system-riscv64 --version

      - name: Install RISC-V Rust target
        shell: bash
        run: |
          rustup target add riscv64gc-unknown-none-elf

      - name: Build Chapter 1 kernel
        shell: bash
        run: |
          cd os
          make

      - name: Generate result summary
        if: always()
        shell: bash
        run: |
          {
            echo "# rCore Chapter 1"
            echo
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "## ✅ Build passed"
              echo
              echo "Chapter 1 kernel compiled successfully."
            else
              echo "## ❌ Build failed"
              echo
              echo "Please inspect the failed build step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
