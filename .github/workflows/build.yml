name: rCore Chapter 8 Autograding

on:
  push:
    branches:
      - ch8
    paths-ignore:
      - README.md
      - "**/*.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1


jobs:
  basic-test:
    name: Test Chapter 8

    runs-on: ubuntu-latest

    container:
      image: alicesama/rcore-ci:2024a

    outputs:
      points: ${{ steps.read-score.outputs.points }}


    steps:

      - name: Checkout submission
        uses: actions/checkout@v4


      - name: Configure environment
        shell: bash
        run: |
          qemu-system-riscv64 --version

          rustc --version
          cargo --version

          rustup target add riscv64gc-unknown-none-elf

          git config --global --add safe.directory \
            "/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}"


      - name: Clone official checker
        shell: bash
        run: |
          git clone \
            --depth 1 \
            https://github.com/LearningOS/rCore-Tutorial-Checker.git \
            ci-user

          git clone \
            --depth 1 \
            https://github.com/LearningOS/rCore-Tutorial-Test.git \
            ci-user/user


      - name: Run Chapter 8 tests
        shell: bash
        run: |
          cd ci-user

          set -o pipefail

          make test CHAPTER=8 | tee ../output.txt


      - name: Read test score
        id: read-score
        shell: bash
        run: |

          POINTS=$(
            grep -a "Test passed" output.txt \
            | grep -oP '\d+/\d+' \
            | tail -n 1
          )


          if [ -z "$POINTS" ]; then

            echo "Unable to find test score."

            echo "Last output:"
            tail -n 100 output.txt || true

            exit 1

          fi


          echo "points=$POINTS" >> "$GITHUB_OUTPUT"

          echo "Detected score: $POINTS"



      - name: Require full points
        shell: bash
        run: |

          POINTS="${{ steps.read-score.outputs.points }}"

          GOT="${POINTS%%/*}"

          TOTAL="${POINTS##*/}"


          echo "Score: $POINTS"


          if [ "$GOT" != "$TOTAL" ]; then

            echo "Chapter 8 tests failed: $POINTS"

            exit 1

          fi


          echo "Chapter 8 passed: $POINTS"



      - name: Generate summary
        if: always()
        shell: bash
        run: |

          POINTS="${{ steps.read-score.outputs.points }}"


          {
            echo "# rCore Chapter 8"

            echo

            echo "- Repository: \`${{ github.repository }}\`"

            echo "- Branch: \`${{ github.ref_name }}\`"

            echo "- Commit: \`${{ github.sha }}\`"

            echo

            echo "- Score: **${POINTS}**"


          } >> "$GITHUB_STEP_SUMMARY"



      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-8-test-output
          path: output.txt
          retention-days: 30
          if-no-files-found: warn
