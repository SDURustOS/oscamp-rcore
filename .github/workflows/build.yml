name: rCore Chapter 5 Autograding

on:
  push:
    branches:
      - ch5
    paths-ignore:
      - README.md
      - "**/*.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  basic-test:
    name: Test Chapter 5
    runs-on: ubuntu-latest

    container:
      image: alicesama/rcore-ci:2024a

    outputs:
      points: ${{ steps.read-score.outputs.points }}

    steps:
      - name: Checkout submission
        uses: actions/checkout@v4

      - name: Configure environment
        shell: bash
        run: |
          qemu-system-riscv64 --version
          rustc --version
          cargo --version

          rustup target add riscv64gc-unknown-none-elf

          git config --global --add safe.directory \
            "/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}"

      - name: Clone official checker
        shell: bash
        run: |
          git clone \
            --depth 1 \
            https://github.com/LearningOS/rCore-Tutorial-Checker.git \
            ci-user

          git clone \
            --depth 1 \
            https://github.com/LearningOS/rCore-Tutorial-Test.git \
            ci-user/user

      - name: Run Chapter 5 tests
        shell: bash
        run: |
          cd ci-user

          set -o pipefail
          make test CHAPTER=5 | tee ../output.txt

      - name: Read test score
        id: read-score
        shell: bash
        run: |
          POINTS=$(
            grep -a "Test passed" output.txt \
              | grep -oP '\d+/\d+' \
              | tail -n 1
          )

          if [ -z "$POINTS" ]; then
            echo "Unable to find the test score in output.txt."
            echo
            echo "Last 100 lines of test output:"
            tail -n 100 output.txt || true
            exit 1
          fi

          echo "points=$POINTS" >> "$GITHUB_OUTPUT"
          echo "Detected score: $POINTS"

      - name: Require full points
        shell: bash
        run: |
          POINTS="${{ steps.read-score.outputs.points }}"
          GOT="${POINTS%%/*}"
          TOTAL="${POINTS##*/}"

          echo "Received score: $POINTS"

          if [ "$GOT" != "$TOTAL" ]; then
            echo "Chapter 5 tests did not receive full points: $POINTS"
            exit 1
          fi

          echo "All Chapter 5 tests passed: $POINTS"

      - name: Generate result summary
        if: always()
        shell: bash
        run: |
          POINTS="${{ steps.read-score.outputs.points }}"

          {
            echo "# rCore Chapter 5"
            echo
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo

            if [ -n "$POINTS" ]; then
              echo "- Test score: **$POINTS**"
              echo
            fi

            if [ "${{ job.status }}" = "success" ]; then
              echo "## ✅ All tests passed"
            else
              echo "## ❌ Tests failed"
              echo
              echo "Please inspect the test logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-5-test-output
          path: output.txt
          retention-days: 30
          if-no-files-found: warn
